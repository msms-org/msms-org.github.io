title: MSMS
description: Maliyadeva Simulation & Modelling Society — Maliyadeva College, Kurunegala

# Leave this empty for a user site (username.github.io).
# Set to "/repo-name" if hosting at username.github.io/repo-name.
baseurl: ""

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: none
  auto_ids: true
  toc_levels: 1..3

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - build-docs.sh
  - tex
  - "*-body.html"

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="MSMS">
  <defs>
    <linearGradient id="mGlow" gradientUnits="userSpaceOnUse" x1="12" y1="4" x2="12" y2="17">
      <stop offset="0"   stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="1"   stop-color="#67E8F9" stop-opacity="1"/>
    </linearGradient>
    <filter id="softGlow"  x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
    <filter id="tightGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.4"/>
    </filter>
  </defs>

  <rect width="24" height="24" rx="4" fill="#0B0F14"/>

  <!-- Faces -->
  <path d="M3 7 L12 11.5 L21 7 L21 16 L12 20.5 L3 16 Z" fill="#0F2A1F"/>
  <path d="M12 2.5 L21 7 L12 11.5 L3 7 Z" fill="#14452F"/>

  <!-- Face grids (3×3 per face) -->
  <g stroke="#4ADE80" stroke-width="0.15" opacity="0.35" fill="none">
    <path d="M9 4 L18 8.5   M6 5.5 L15 10"/>
    <path d="M15 4 L6 8.5   M18 5.5 L9 10"/>
    <path d="M3 10 L12 14.5 M3 13 L12 17.5"/>
    <path d="M6 8.5 L6 17.5  M9 10 L9 19"/>
    <path d="M12 14.5 L21 10 M12 17.5 L21 13"/>
    <path d="M15 10 L15 19  M18 8.5 L18 17.5"/>
  </g>

  <!-- Cube edges -->
  <g stroke="#4ADE80" stroke-width="0.5" fill="none"
     stroke-linejoin="round" stroke-linecap="round" opacity="0.85">
    <path d="M12 2.5 L3 7 L3 16 L12 20.5 L21 16 L21 7 Z"/>
    <path d="M12 11.5 L3 7 M12 11.5 L21 7 M12 11.5 L12 20.5"/>
  </g>

  <!-- M glow, three layers: soft halo → mid → core -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 16 L3 7 L12 11.5 L21 7 L21 16"
          stroke="url(#mGlow)" stroke-width="2.2"
          filter="url(#softGlow)" opacity="0.7"/>
    <path d="M3 16 L3 7 L12 11.5 L21 7 L21 16"
          stroke="url(#mGlow)" stroke-width="1.1"
          filter="url(#tightGlow)" opacity="0.85"/>
    <path d="M3 16 L3 7 L12 11.5 L21 7 L21 16"
          stroke="url(#mGlow)" stroke-width="0.45" opacity="0.95"/>
  </g>
</svg>
